name: Synthesis Mission Lab Checks
on:
  push:
    branches:
      - main
      - feature/interactive-mission-lab-oct2026
      - feature/real-small-evidence-lessons-20261015
      - feature/evidence-story-lesson-integration-20261015
      - feature/magnesium-evidence-reversal-20261015
      - feature/secular-evidence-chronicle-20261016
      - feature/evidence-decision-arena-20261016
      - feature/allmeta-research-studio-20261016
      - feature/benchmark-human-review-exchange-20261017
      - feature/guided-meta-onramp-20261017
      - feature/hart-source-transfer-20261017
      - feature/french-html5-standards-20261018
    paths:
      - 'mission-lab*'
      - 'real-evidence*'
      - 'evidence-story*'
      - 'evidence-arena*'
      - 'research-studio*'
      - 'review-exchange*'
      - 'guided-start*'
      - 'hart-transfer*'
      - 'tests/hart-transfer.test.cjs'
      - 'tests/hart-dom.test.cjs'
      - 'tests/french-standards-mode.test.cjs'
      - 'scripts/verify_hart_transfer.R'
      - 'tests/guided-start.test.cjs'
      - 'tests/review-exchange.test.cjs'
      - 'tests/research-studio.test.cjs'
      - 'scripts/verify_small_meta.R'
      - 'tests/evidence-arena.test.cjs'
      - 'lesson-story*'
      - 'magnesium-*'
      - 'tests/magnesium-reversal.test.cjs'
      - 'scripts/verify_magnesium_reversal.R'
      - 'tests/evidence-story-lab.test.cjs'
      - 'tests/story-checkpoints.test.cjs'
      - 'small-meta-data.js'
      - 'lesson-workshops*'
      - 'synthesis-course-*.html'
      - 'tests/real-evidence-lab.test.cjs'
      - 'synthesis-course.html'
      - 'index.html'
      - 'tests/mission-lab.test.cjs'
      - '.github/workflows/mission-lab-checks.yml'
  pull_request:
    paths:
      - 'mission-lab*'
      - 'real-evidence*'
      - 'evidence-story*'
      - 'evidence-arena*'
      - 'research-studio*'
      - 'review-exchange*'
      - 'guided-start*'
      - 'hart-transfer*'
      - 'tests/hart-transfer.test.cjs'
      - 'tests/hart-dom.test.cjs'
      - 'tests/french-standards-mode.test.cjs'
      - 'scripts/verify_hart_transfer.R'
      - 'tests/guided-start.test.cjs'
      - 'tests/review-exchange.test.cjs'
      - 'tests/research-studio.test.cjs'
      - 'scripts/verify_small_meta.R'
      - 'tests/evidence-arena.test.cjs'
      - 'lesson-story*'
      - 'magnesium-*'
      - 'tests/magnesium-reversal.test.cjs'
      - 'scripts/verify_magnesium_reversal.R'
      - 'tests/evidence-story-lab.test.cjs'
      - 'tests/story-checkpoints.test.cjs'
      - 'small-meta-data.js'
      - 'lesson-workshops*'
      - 'synthesis-course-*.html'
      - 'tests/real-evidence-lab.test.cjs'
      - 'synthesis-course.html'
      - 'index.html'
      - 'tests/mission-lab.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mission-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        run: |
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Check JavaScript syntax
        run: |
          node --check mission-lab-data.js
          node --check mission-lab.js
          node --check tests/mission-lab.test.cjs
          node --check small-meta-data.js
          node --check real-evidence-i18n.js
          node --check real-evidence-full-prompts.js
          node --check real-evidence-lab.js
          node --check lesson-workshops.js
          node --check evidence-story-lab.js
          node --check evidence-story-ui.js
          node --check lesson-story-checkpoints.js
          node --check tests/evidence-story-lab.test.cjs
          node --check tests/story-checkpoints.test.cjs
          node --check magnesium-reversal-data.js
          node --check magnesium-reversal-ui.js
          node --check magnesium-lesson-integration.js
          node --check magnesium-evidence-chronicle.js
          node --check tests/magnesium-reversal.test.cjs
          node --check evidence-arena-core.js
          node --check evidence-arena.js
          node --check evidence-arena-integration.js
          node --check tests/evidence-arena.test.cjs
          node --check research-studio-core.js
          node --check research-studio.js
          node --check research-studio-integration.js
          node --check tests/research-studio.test.cjs
          node --check review-exchange-core.js
          node --check review-exchange.js
          node --check tests/review-exchange.test.cjs
          node --check guided-start-core.js
          node --check guided-start.js
          node --check tests/guided-start.test.cjs
          node --check hart-transfer-core.js
          node --check hart-transfer.js
          node --check tests/hart-transfer.test.cjs
          node --check tests/hart-dom.test.cjs
          node --check tests/french-standards-mode.test.cjs
          node --check tests/real-evidence-lab.test.cjs
      - name: Run interactive learning tests
        run: node --test tests/mission-lab.test.cjs tests/real-evidence-lab.test.cjs tests/evidence-story-lab.test.cjs tests/story-checkpoints.test.cjs tests/magnesium-reversal.test.cjs tests/evidence-arena.test.cjs tests/research-studio.test.cjs tests/review-exchange.test.cjs tests/guided-start.test.cjs tests/hart-transfer.test.cjs tests/hart-dom.test.cjs tests/french-standards-mode.test.cjs

  verify-magnesium-r:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        run: |
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install verification packages
        run: Rscript -e 'install.packages(c("metadat", "metafor"), repos="https://cloud.r-project.org")'
      - name: Reproduce archival magnesium Peto benchmarks
        run: Rscript scripts/verify_magnesium_reversal.R
      - name: Reproduce Hine and Berkey R reference outputs
        run: Rscript scripts/verify_small_meta.R
      - name: Reproduce Hart historical incidence-rate model
        run: Rscript scripts/verify_hart_transfer.R
