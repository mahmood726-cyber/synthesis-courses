name: Synthesis Mission Lab Checks
on:
  push:
    branches:
      - main
      - feature/interactive-mission-lab-oct2026
      - feature/real-small-evidence-lessons-20261015
      - feature/evidence-story-lesson-integration-20261015
      - feature/magnesium-evidence-reversal-20261015
      - feature/secular-evidence-chronicle-20261016
    paths:
      - 'mission-lab*'
      - 'real-evidence*'
      - 'evidence-story*'
      - 'lesson-story*'
      - 'magnesium-*'
      - 'tests/magnesium-reversal.test.cjs'
      - 'scripts/verify_magnesium_reversal.R'
      - 'tests/evidence-story-lab.test.cjs'
      - 'tests/story-checkpoints.test.cjs'
      - 'small-meta-data.js'
      - 'lesson-workshops*'
      - 'synthesis-course-*.html'
      - 'tests/real-evidence-lab.test.cjs'
      - 'synthesis-course.html'
      - 'index.html'
      - 'tests/mission-lab.test.cjs'
      - '.github/workflows/mission-lab-checks.yml'
  pull_request:
    paths:
      - 'mission-lab*'
      - 'real-evidence*'
      - 'evidence-story*'
      - 'lesson-story*'
      - 'magnesium-*'
      - 'tests/magnesium-reversal.test.cjs'
      - 'scripts/verify_magnesium_reversal.R'
      - 'tests/evidence-story-lab.test.cjs'
      - 'tests/story-checkpoints.test.cjs'
      - 'small-meta-data.js'
      - 'lesson-workshops*'
      - 'synthesis-course-*.html'
      - 'tests/real-evidence-lab.test.cjs'
      - 'synthesis-course.html'
      - 'index.html'
      - 'tests/mission-lab.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mission-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Check JavaScript syntax
        run: |
          node --check mission-lab-data.js
          node --check mission-lab.js
          node --check tests/mission-lab.test.cjs
          node --check small-meta-data.js
          node --check real-evidence-i18n.js
          node --check real-evidence-full-prompts.js
          node --check real-evidence-lab.js
          node --check lesson-workshops.js
          node --check evidence-story-lab.js
          node --check evidence-story-ui.js
          node --check lesson-story-checkpoints.js
          node --check tests/evidence-story-lab.test.cjs
          node --check tests/story-checkpoints.test.cjs
          node --check magnesium-reversal-data.js
          node --check magnesium-reversal-ui.js
          node --check magnesium-lesson-integration.js
          node --check magnesium-evidence-chronicle.js
          node --check tests/magnesium-reversal.test.cjs
          node --check tests/real-evidence-lab.test.cjs
      - name: Run interactive learning tests
        run: node --test tests/mission-lab.test.cjs tests/real-evidence-lab.test.cjs tests/evidence-story-lab.test.cjs tests/story-checkpoints.test.cjs tests/magnesium-reversal.test.cjs

  verify-magnesium-r:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install verification packages
        run: Rscript -e 'install.packages(c("metadat", "metafor"), repos="https://cloud.r-project.org")'
      - name: Reproduce archival magnesium Peto benchmarks
        run: Rscript scripts/verify_magnesium_reversal.R
